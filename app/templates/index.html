<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zabbix Analytics</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div><strong>Zabbix Analytics</strong><span class="muted"> · Impact prioritization</span></div>
  <nav>
    <button class="nav active" data-tab="problems">Проблемы</button>
    <button class="nav" data-tab="criticality">Критичность</button>
    <button class="nav" data-tab="scoring">Scoring</button>
  </nav>
</header>
<main>
  <section id="problems" class="tab active">
    <div class="toolbar"><h1>Важные проблемы</h1><div><button onclick="syncNow()">Синхронизировать</button><button onclick="loadProblems()">Обновить</button></div></div>
    <div id="cards" class="cards"></div>
    <div class="panel table-wrap"><table><thead><tr><th>Score</th><th>Severity</th><th>Хост</th><th>Проблема</th><th>Возраст</th><th>Подтверждена</th></tr></thead><tbody id="problemsBody"></tbody></table></div>
  </section>

  <section id="criticality" class="tab">
    <div class="toolbar"><h1>Критичность инфраструктуры</h1><button onclick="recalculate()">Пересчитать score</button></div>
    <div class="grid2">
      <div class="panel"><h2>Хосты</h2><div class="search"><input id="hostSearch" placeholder="Поиск хоста"><button onclick="loadHosts()">Найти</button></div><div id="hostsList"></div></div>
      <div class="panel"><h2>Группы хостов</h2><div id="groupsList"></div></div>
    </div>
  </section>

  <section id="scoring" class="tab">
    <div class="toolbar"><h1>Правила Scoring</h1><button onclick="recalculate()">Пересчитать score</button></div>
    <div class="panel"><p class="muted">Баллы применяются к совпадающим тегам активной проблемы.</p><div id="rulesList"></div></div>
  </section>
</main>
<div id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
